name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 6 을 타깃으로 하려면 JDK 8 이하가 필요하다 (JDK 11+ 는 source/target 7 미만을 거부).
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - run: mvn -B clean package
